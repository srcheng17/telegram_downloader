{{ define "content" }}
<div id="home-page" class="home-page">
    <div class="section-header">
        <h2>发起下载任务</h2>
        <p class="muted">粘贴 Telegraph 页面链接后，可在“日志”页查看实时进度。</p>
    </div>
    <div
        id="startup-recovery-banner-home"
        class="startup-recovery-banner is-hidden"
        role="status"
        aria-live="polite"
        aria-hidden="true"
    >
        <p id="startup-recovery-text-home" class="startup-recovery-text"></p>
        <div class="startup-recovery-actions">
            <a
                id="startup-recovery-link-home"
                class="startup-recovery-link"
                href="/logs"
                hx-get="/logs"
                hx-target="#content"
                hx-push-url="true"
            >去日志页查看</a>
            <button type="button" id="startup-recovery-dismiss-home" class="btn-secondary startup-recovery-dismiss">关闭</button>
        </div>
    </div>
    <details id="summary-collapsible-home" class="summary-collapsible" open>
        <summary class="summary-toggle collapsible-summary">任务概览</summary>
        <div id="summary-panel" class="summary-grid" aria-live="polite">
            <article class="summary-card">
                <p class="summary-label">任务总数</p>
                <p id="summary-total" class="summary-value">-</p>
            </article>
            <article class="summary-card">
                <p class="summary-label">进行中</p>
                <p id="summary-active" class="summary-value">-</p>
            </article>
            <article class="summary-card">
                <p class="summary-label">成功</p>
                <p id="summary-success" class="summary-value">-</p>
            </article>
            <article class="summary-card">
                <p class="summary-label">失败/已取消</p>
                <p id="summary-failed" class="summary-value">-</p>
            </article>
        </div>
    </details>
    <details id="metadata-history-collapsible" class="summary-collapsible metadata-history-panel" open>
        <summary class="summary-toggle collapsible-summary">最近 20 条填写的元数据</summary>
        <div class="metadata-history-header">
            <h3 id="metadata-history-title" class="sr-only">点击最近记录回填元数据</h3>
        </div>
        <ul id="metadata-history-list" class="metadata-history-list" aria-live="polite">
            <li class="metadata-history-empty">暂无最近填写记录。</li>
        </ul>
    </details>
    <form id="download-form" action="/download" method="post" novalidate>
        <div class="form-group input-mode-group">
            <span class="input-mode-title">任务来源</span>
            <div class="input-mode-options">
                <label class="input-mode-option">
                    <input type="radio" name="input_mode" value="url" checked>
                    <span>URL 下载</span>
                </label>
                <label class="input-mode-option">
                    <input type="radio" name="input_mode" value="upload">
                    <span>上传压缩包</span>
                </label>
            </div>
        </div>

        <div id="url-input-group" class="form-group">
            <label for="url">Telegraph 链接 <span class="required-mark" aria-hidden="true">*</span></label>
            <input type="text" id="url" name="url" placeholder="https://telegra.ph/..." required>
        </div>

        <div id="archive-input-group" class="form-group is-hidden" aria-hidden="true">
            <label for="archive_file">压缩包文件 <span class="required-mark" aria-hidden="true">*</span></label>
            <input type="file" id="archive_file" name="archive_file" accept=".zip,.rar,.7z" disabled>
        </div>

        <div class="home-metadata-grid">
            <div class="form-group">
                <label for="author">作者</label>
                <input type="text" id="author" name="author" placeholder="例如：张三">
            </div>
            <div class="form-group">
                <label for="series_name">漫画系列名</label>
                <input type="text" id="series_name" name="series_name" placeholder="例如：银河系列">
            </div>
            <div class="form-group">
                <label for="comic_name">漫画名</label>
                <input type="text" id="comic_name" name="comic_name" placeholder="例如：银河冒险记">
            </div>
            <div class="form-group home-metadata-full">
                <label for="summary">书籍详情介绍</label>
                <textarea id="summary" name="summary" rows="3" placeholder="可填写作品简介或补充信息"></textarea>
            </div>
            <div class="form-group home-metadata-full">
                <label for="tags">标签</label>
                <input type="text" id="tags" name="tags" placeholder="例如：科幻,冒险，连载">
            </div>
            <div class="form-group home-metadata-full">
                <label for="genres">类型</label>
                <input type="text" id="genres" name="genres" placeholder="例如：青年,悬疑，热血">
            </div>
        </div>

        <div class="form-group force-redownload-group">
            <label for="force_redownload" class="force-toggle-label">
                <input type="checkbox" id="force_redownload" name="force" value="1">
                <span>强制重新抓取</span>
            </label>
        </div>
        <button type="submit">开始下载</button>
    </form>
    <div id="download-feedback" class="inline-feedback" role="status" aria-live="polite"></div>
    <div id="download-actions" class="download-actions is-hidden" aria-hidden="true">
        <button type="button" id="download-action-force" class="btn-warning is-hidden">生成新的CBZ</button>
        <button type="button" id="download-action-use-existing" class="btn-secondary is-hidden">取消并下载已有文件</button>
        <button type="button" id="download-action-logs" class="btn-secondary is-hidden">查看日志</button>
        <button type="button" id="download-action-download" class="is-hidden">下载已有文件</button>
    </div>
</div>
{{ end }}
