{{ define "content" }}
<section id="login-page" class="login-panel" hx-history="false" aria-labelledby="login-title">
    <p class="login-brand">漫画工作台</p>
    <h1 id="login-title">登录你的工作区</h1>
    <p class="muted">整理下载、作品信息和书目来源。</p>
    <form id="admin-login-form" action="/api/auth/login" method="post">
        <label for="admin-password">管理员密码</label>
        <input id="admin-password" name="password" type="password" autocomplete="current-password" required aria-describedby="login-feedback">
        <button type="submit">登录</button>
    </form>
    <p id="login-feedback" class="inline-feedback" role="status" aria-live="polite"></p>
    <p class="field-help">使用服务器已配置的管理员密码。</p>
</section>
{{ end }}
