{{ define "content" }}
<div class="section-header">
    <h2>设置</h2>
    <p class="muted">全局设置（影响所有用户后续新任务，不影响运行中任务）。</p>
</div>
<p class="settings-impact-note" role="note">
    设置项为全局生效：点击 <strong>保存设置</strong> 后，仅影响后续新建任务，正在运行的任务会保持原值。
</p>
<form action="/settings" method="post" class="settings-form">
    <div class="form-group settings-grid-item">
        <label for="task_concurrency">任务并发数（同时运行任务数）</label>
        <input type="number" id="task_concurrency" name="task_concurrency" value="{{ .Settings.TaskConcurrency }}" min="1" max="10">
        <p class="field-help">控制同时执行的下载任务数量。</p>
    </div>
    <div class="form-group settings-grid-item">
        <label for="image_concurrency">图片并发数（单任务下载线程）</label>
        <input type="number" id="image_concurrency" name="image_concurrency" value="{{ .Settings.ImageConcurrency }}" min="1" max="20">
        <p class="field-help">控制单个任务内并发下载图片的线程数，值越大资源占用越高。</p>
    </div>
    <div class="form-group settings-grid-item">
        <label for="timeout">下载超时时间（秒）</label>
        <input type="number" id="timeout" name="timeout" value="{{ .Settings.Timeout }}" min="1">
        <p class="field-help">单次请求超过该时长后会进入超时处理流程。</p>
    </div>
    <div class="form-group settings-grid-item">
        <label for="retries">下载重试次数</label>
        <input type="number" id="retries" name="retries" value="{{ .Settings.Retries }}" min="0">
        <p class="field-help">下载失败后的自动重试次数。</p>
    </div>
    <div class="form-group settings-grid-item settings-grid-item-full">
        <label for="log_retention_days">日志保留天数</label>
        <input type="number" id="log_retention_days" name="log_retention_days" value="{{ .Settings.LogRetentionDays }}" min="1">
        <p class="field-help">日志页中任务记录的保留时长。</p>
    </div>
    <div class="form-group settings-grid-item settings-grid-item-full">
        <label for="file_retention_days">文件缓存保留天数</label>
        <input type="number" id="file_retention_days" name="file_retention_days" value="{{ .Settings.FileRetentionDays }}" min="1">
        <p class="field-help">已生成 ZIP/CBZ 文件的缓存保留时长。</p>
    </div>
    <div class="form-group settings-grid-item settings-grid-item-full">
        <span class="settings-radio-label">成功任务动作</span>
        <label class="settings-radio-option">
            <input type="radio" name="download_action_mode" value="browser" {{ if eq .Settings.DownloadActionMode "browser" }}checked{{ end }}>
            <span>浏览器下载（默认）</span>
        </label>
        <label class="settings-radio-option">
            <input type="radio" name="download_action_mode" value="komga_copy" {{ if eq .Settings.DownloadActionMode "komga_copy" }}checked{{ end }}>
            <span>复制到 Komga</span>
        </label>
        <p class="field-help">切换日志页成功任务“下载”按钮的行为：默认浏览器下载，也可改为复制到固定的 Komga 目录。</p>
    </div>
    <button type="submit">保存设置</button>
</form>
{{ end }}
