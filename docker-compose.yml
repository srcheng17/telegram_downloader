services:
  app:
    build: .
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      KOMGA_DIR: ${KOMGA_DIR:-}
    ports:
      - "${APP_PORT:-5002}:5000"
    volumes:
      - ${DATA_DIR_HOST:-./data/single-host}:/data
      - ${KOMGA_DIR_HOST:-./data/komga}:/komga
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
