services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telegraph}
      POSTGRES_USER: ${POSTGRES_USER:-telegraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telegraph}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telegraph} -d ${POSTGRES_DB:-telegraph}"]
      interval: 10s
      timeout: 5s
      retries: 5

  go-api:
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    build:
      context: .
    restart: unless-stopped
    environment:
      PORT: "5000"
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:?required}
      ALLOW_INSECURE_LOOPBACK: ${ALLOW_INSECURE_LOOPBACK:-false}
      ADMIN_BOOTSTRAP_PASSWORD_FILE: /run/secrets/admin-bootstrap-password
      SOURCE_SETTINGS_MASTER_KEY_FILE: /run/secrets/source-settings-master-key
      DATABASE_URL: postgresql://${POSTGRES_USER:-telegraph}:${POSTGRES_PASSWORD:-telegraph}@postgres:5432/${POSTGRES_DB:-telegraph}?sslmode=disable
      INTERNAL_ENQUEUE_TOKEN: ${INTERNAL_ENQUEUE_TOKEN:?required}
      GO_DOWNLOAD_TIMEOUT: ${GO_DOWNLOAD_TIMEOUT:-30}
      GO_DOWNLOAD_RETRIES: ${GO_DOWNLOAD_RETRIES:-10}
      GO_IMAGE_CONCURRENCY: ${GO_IMAGE_CONCURRENCY:-2}
      DOWNLOAD_PATH: /app/downloaded_images
      TEMP_PATH: /app/temp_downloads
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-true}
      TELEGRAM_MAX_SOURCE_BYTES: ${TELEGRAM_MAX_SOURCE_BYTES:-524288000}
      TELEGRAM_PRIVATE_ROOT: /app/telegram-private
      SOURCE_RETENTION_PATH: /app/source-retention
      KOMGA_LIBRARY_ROOT: ${KOMGA_LIBRARY_ROOT:-/app/komga/myReadingManga}
      KOMGA_LIBRARY_MAPPINGS: ${KOMGA_LIBRARY_MAPPINGS:-[]}
      KOMGA_READONLY_LIBRARY_IDS: ${KOMGA_READONLY_LIBRARY_IDS:-[]}
      KOMGA_EDIT_BACKUP_ROOT: /app/komga-edit-backups
    volumes:
      - type: bind
        source: ${ADMIN_BOOTSTRAP_PASSWORD_FILE_HOST:-./secrets/admin-bootstrap-password}
        target: /run/secrets/admin-bootstrap-password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SOURCE_SETTINGS_MASTER_KEY_FILE_HOST:-./secrets/source-settings-master-key}
        target: /run/secrets/source-settings-master-key
        read_only: true
        bind:
          create_host_path: false
      - ./downloaded_images:/app/downloaded_images
      - ./temp_downloads:/app/temp_downloads
      - telegram-private:/app/telegram-private
      - source-retention:/app/source-retention
      - komga-edit-backups:/app/komga-edit-backups
      - ./web/static:/app/static:ro
      - ${KOMGA_LIBRARY_ROOT_HOST:-/Users/ryancheng/docker_data/komga/data/myReadingManga}:${KOMGA_LIBRARY_ROOT:-/app/komga/myReadingManga}:rw
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy

  go-worker:
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    build:
      context: .
    entrypoint: ["/app/go-worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-telegraph}:${POSTGRES_PASSWORD:-telegraph}@postgres:5432/${POSTGRES_DB:-telegraph}?sslmode=disable
      INTERNAL_ENQUEUE_TOKEN: ${INTERNAL_ENQUEUE_TOKEN:?required}
      CONSUMER_NAME: ${GO_WORKER_CONSUMER_NAME:-}
      GO_DOWNLOAD_TIMEOUT: ${GO_DOWNLOAD_TIMEOUT:-30}
      GO_DOWNLOAD_RETRIES: ${GO_DOWNLOAD_RETRIES:-10}
      GO_IMAGE_CONCURRENCY: ${GO_IMAGE_CONCURRENCY:-2}
      DOWNLOAD_PATH: /app/downloaded_images
      TEMP_PATH: /app/temp_downloads
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-true}
      TELEGRAM_MAX_SOURCE_BYTES: ${TELEGRAM_MAX_SOURCE_BYTES:-524288000}
      TELEGRAM_PRIVATE_ROOT: /app/telegram-private
      SOURCE_RETENTION_PATH: /app/source-retention
    volumes:
      - ./downloaded_images:/app/downloaded_images
      - ./temp_downloads:/app/temp_downloads
      - telegram-private:/app/telegram-private
      - source-retention:/app/source-retention
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    image: nginx:1.30-alpine3.24
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-5002}:80"
    volumes:
      - ./deploy/nginx/canary-go-full.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      go-api:
        condition: service_healthy

volumes:
  telegram-private:
  source-retention:
  komga-edit-backups:
