services:
  postgres:
    image: postgres:16-alpine
    container_name: telegraph-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telegraph}
      POSTGRES_USER: ${POSTGRES_USER:-telegraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telegraph}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telegraph} -d ${POSTGRES_DB:-telegraph}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: telegraph-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  go-api:
    build:
      context: ./go-backend
    container_name: telegraph-go-api
    environment:
      PORT: "5000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-telegraph}:${POSTGRES_PASSWORD:-telegraph}@postgres:5432/${POSTGRES_DB:-telegraph}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      STREAM_NAME: ${STREAM_NAME:-download_tasks}
      INTERNAL_ENQUEUE_TOKEN: ${INTERNAL_ENQUEUE_TOKEN:-go-bridge-token}
      GO_DOWNLOAD_TIMEOUT: ${GO_DOWNLOAD_TIMEOUT:-30}
      GO_DOWNLOAD_RETRIES: ${GO_DOWNLOAD_RETRIES:-10}
      GO_IMAGE_CONCURRENCY: ${GO_IMAGE_CONCURRENCY:-2}
      DOWNLOAD_PATH: /app/downloaded_images
    volumes:
      - ./downloaded_images:/app/downloaded_images
      - ./static:/app/static:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  go-worker:
    build:
      context: ./go-backend
    container_name: telegraph-go-worker
    entrypoint: ["/app/go-worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-telegraph}:${POSTGRES_PASSWORD:-telegraph}@postgres:5432/${POSTGRES_DB:-telegraph}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      STREAM_NAME: ${STREAM_NAME:-download_tasks}
      CONSUMER_GROUP: ${CONSUMER_GROUP:-go-workers}
      CONSUMER_NAME: ${GO_WORKER_CONSUMER_NAME:-}
      GO_DOWNLOAD_TIMEOUT: ${GO_DOWNLOAD_TIMEOUT:-30}
      GO_DOWNLOAD_RETRIES: ${GO_DOWNLOAD_RETRIES:-10}
      GO_IMAGE_CONCURRENCY: ${GO_IMAGE_CONCURRENCY:-2}
      DOWNLOAD_PATH: /app/downloaded_images
      TEMP_PATH: /app/temp_downloads
    volumes:
      - ./downloaded_images:/app/downloaded_images
      - ./temp_downloads:/app/temp_downloads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    container_name: telegraph-gateway
    ports:
      - "${APP_PORT:-5002}:80"
    volumes:
      - ./deploy/nginx/canary-go-full.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      go-api:
        condition: service_healthy
