resolver 127.0.0.11 valid=10s ipv6=off;

upstream telegraph_go_api {
    zone telegraph_go_api 64k;
    server go-api:5000 resolve;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 64m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /download {
        proxy_pass http://telegraph_go_api;
    }

    # Model inference is bounded separately from ordinary API requests.
    location = /api/settings/ai/test {
        proxy_pass http://telegraph_go_api;
        proxy_read_timeout 140s;
        proxy_send_timeout 140s;
    }

    location = /api/metadata/extract {
        proxy_pass http://telegraph_go_api;
        proxy_read_timeout 140s;
        proxy_send_timeout 140s;
    }

    location ^~ /api/ {
        proxy_pass http://telegraph_go_api;
    }

    # QR/login events use bounded heartbeats and must not be buffered.
    location ^~ /api/telegram/ {
        proxy_pass http://telegraph_go_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
    }

    location ^~ /v2/ {
        proxy_pass http://telegraph_go_api;
    }

    location = /v2 {
        proxy_pass http://telegraph_go_api;
    }

    location ^~ /healthz {
        proxy_pass http://telegraph_go_api;
    }

    location / {
        proxy_pass http://telegraph_go_api;
    }
}
