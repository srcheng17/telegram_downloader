upstream telegraph_go_api {
    server go-api:5000;
}

upstream telegraph_python_web {
    server web:5000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 64m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /download {
        proxy_pass http://telegraph_go_api;
    }

    location ^~ /api/ {
        proxy_pass http://telegraph_go_api;
    }

    location ^~ /v2/ {
        proxy_pass http://telegraph_go_api;
    }

    location = /v2 {
        proxy_pass http://telegraph_go_api;
    }

    location ^~ /healthz {
        proxy_pass http://telegraph_go_api;
    }

    location / {
        proxy_pass http://telegraph_python_web;
    }
}
